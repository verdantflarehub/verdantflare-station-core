name: Station Core

env:
  IMAGE_NAME: wod/verdantflare-station
  SERVICE: station-core
  VERSION: 0.3.0

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  image:
    name: Build image and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        id: registry
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid or missing registry endpoint'; exit 1; }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo 'Invalid image repository'; exit 1; }
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "image=$endpoint/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        env:
          IMAGE: ${{ steps.registry.outputs.image }}:${{ env.SERVICE }}-v${{ env.VERSION }}
        run: bash scripts/check-image-absent.sh
      - name: Build image
        if: github.event_name != 'push' || github.ref != 'refs/heads/release'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.SERVICE }}-v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish versioned release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.image }}:${{ env.SERVICE }}-v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
